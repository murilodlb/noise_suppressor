[project]
name = "noise-suppressor"
version = "0.1.0"
description = "Non-stationary noise suppression using TinyU-Net and DSP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.7",
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "ruff>=0.17.3",
]

[project.scripts]
noise_suppressor = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
